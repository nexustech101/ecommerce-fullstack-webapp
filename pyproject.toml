[project]
name = "ecommerce-backend"
version = "1.2.0"
description = "Ecommerce backend built with FastAPI and registers.db"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "email-validator>=2.1.0",
  "python-dotenv>=1.0.0",
  "registers>=7.0.0",
  "stripe>=14.1.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
